name: CI
on:
  push:
    branches: [main, 'revision/**']
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Get pinned package sources
        run: |
          git clone https://github.com/itsuzef/vst-bench-ml-public.git "$RUNNER_TEMP/package"
          python -c "import json,os,subprocess; pin=json.load(open('fixtures/expected-output.json'))['package']['git_commit']; subprocess.run(['git','-C',os.environ['RUNNER_TEMP']+'/package','checkout',pin],check=True)"
          echo "PACKAGE_VERSION=$(python -c "import json; print(json.load(open('fixtures/expected-output.json'))['package']['version'])")" >> "$GITHUB_ENV"
      - name: Download and install the published package
        run: |
          python -m pip install --require-hashes -r "$RUNNER_TEMP/package/requirements/lock.txt"
          python -m pip download --no-deps --only-binary :all: --dest "$RUNNER_TEMP/dist" "vst-bench-ml==$PACKAGE_VERSION"
          python -m pip download --no-deps --no-binary :all: --dest "$RUNNER_TEMP/dist" "vst-bench-ml==$PACKAGE_VERSION"
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Build fixture and runner
        run: sh scripts/build.sh "$RUNNER_TEMP/build"
      - name: Validate complete workflow
        run: |
          python -B scripts/validate.py --build-dir "$RUNNER_TEMP/build" \
            --package-repo "$RUNNER_TEMP/package" \
            --package-wheel "$RUNNER_TEMP/dist/vst_bench_ml-$PACKAGE_VERSION-py3-none-any.whl" \
            --package-sdist "$RUNNER_TEMP/dist/vst_bench_ml-$PACKAGE_VERSION.tar.gz" \
            --dependency-lock "$RUNNER_TEMP/package/requirements/lock.txt" \
            --python "$(command -v python)" --work-dir "$RUNNER_TEMP/results"
      - name: Export sealed source snapshots
        run: |
          python -B scripts/export_archives.py --package-repo "$RUNNER_TEMP/package" --output "$RUNNER_TEMP/export"
          mkdir "$RUNNER_TEMP/sealed"
          cd "$RUNNER_TEMP/sealed"
          for archive in "$RUNNER_TEMP"/export/*.zip; do unzip -q "$archive"; done
          shasum -a 256 "$RUNNER_TEMP"/export/*.zip
      - name: Build and validate from the sealed snapshots alone
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd "$RUNNER_TEMP/sealed"
          HOST_SNAPSHOT="$PWD/$(echo vst-bench-dataset-host-*)"
          PACKAGE_SNAPSHOT="$PWD/$(echo vst-bench-ml-*)"
          sh "$HOST_SNAPSHOT/scripts/build.sh" "$RUNNER_TEMP/sealed-build"
          python -B "$HOST_SNAPSHOT/scripts/validate.py" --build-dir "$RUNNER_TEMP/sealed-build" \
            --package-repo "$PACKAGE_SNAPSHOT" \
            --package-wheel "$RUNNER_TEMP/dist/vst_bench_ml-$PACKAGE_VERSION-py3-none-any.whl" \
            --package-sdist "$RUNNER_TEMP/dist/vst_bench_ml-$PACKAGE_VERSION.tar.gz" \
            --dependency-lock "$PACKAGE_SNAPSHOT/requirements/lock.txt" \
            --python "$(command -v python)" --work-dir "$RUNNER_TEMP/sealed-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-source-snapshots
          path: |
            ${{ runner.temp }}/export/*.zip
            ${{ runner.temp }}/export/archive-receipt.json
          if-no-files-found: error
