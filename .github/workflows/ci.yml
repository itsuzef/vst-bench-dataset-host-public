name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Get pinned package sources
        run: |
          git clone https://github.com/itsuzef/vst-bench-ml-public.git "$RUNNER_TEMP/package"
          python -c "import json,os,subprocess; pin=json.load(open('fixtures/expected-output.json'))['package']['git_commit']; subprocess.run(['git','-C',os.environ['RUNNER_TEMP']+'/package','checkout',pin],check=True)"
      - name: Build and install pinned package
        run: |
          python -m pip install --require-hashes -r "$RUNNER_TEMP/package/requirements/lock.txt"
          python -m pip install build
          python -m build "$RUNNER_TEMP/package" --outdir "$RUNNER_TEMP/dist"
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Build fixture and runner
        run: sh scripts/build.sh "$RUNNER_TEMP/build"
      - name: Validate complete workflow
        run: |
          python -B scripts/validate.py --build-dir "$RUNNER_TEMP/build" \
            --package-repo "$RUNNER_TEMP/package" \
            --package-wheel "$RUNNER_TEMP/dist/vst_bench_ml-0.1.1-py3-none-any.whl" \
            --package-sdist "$RUNNER_TEMP/dist/vst_bench_ml-0.1.1.tar.gz" \
            --dependency-lock "$RUNNER_TEMP/package/requirements/lock.txt" \
            --python "$(command -v python)" --work-dir "$RUNNER_TEMP/results"
